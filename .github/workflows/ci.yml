name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: aion_user
          POSTGRES_PASSWORD: aion_password
          POSTGRES_DB: aion_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_NAME: aion_db
      DB_USER: aion_user
      DB_PASSWORD: aion_password
      DB_HOST: localhost
      DB_PORT: 5432
      SECURITY_KEY_API: test_secret_key
      DEBUG_API: "True"
      FERNET_KEY: UQJmZ_sT6y5qGkHnQpXvW8M1bY9oR0tZ3lE7cF2hD4g=

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          cd aionapi
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage  # For test coverage reports

      - name: Wait for PostgreSQL
        run: |
          while ! pg_isready -h localhost -p 5432 -U aion_user; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run Migrations
        run: |
          cd aionapi
          python manage.py migrate

      - name: Run Tests
        run: |
          cd aionapi
          python manage.py test api.tests

  frontend-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd aionapp
          npm install

      - name: Run Linter
        run: |
          cd aionapp
          npm run lint
